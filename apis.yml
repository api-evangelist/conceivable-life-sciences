aid: conceivable-life-sciences
name: Conceivable Life Sciences
description: 'Conceivable Life Sciences is a fertility technology company founded in 2021 that
  builds AURA, an AI-powered, end-to-end automated in vitro fertilization (IVF) laboratory. AURA
  combines six integrated robotic workstations, advanced optics, machine vision and AI inference to
  automate more than 200 manual embryology steps — sperm preparation, oocyte retrieval and
  denudation, ICSI, dish preparation, embryo culture and vitrification — so that embryologists
  supervise rather than perform each micromanipulation. The company raised a $50M Series A in
  September 2025 (bringing total funding to $70M), opened the first automated IVF lab in Mexico
  City, and has partnered with IVI RMA Global to deploy AURA in a US clinic. Its public surface is
  a corporate and scientific one — research papers, patents, press and clinical trial registrations
  — with no developer program, public API, SDK or machine-readable specification of any kind.'
